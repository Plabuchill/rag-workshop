name: rag-eval

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: pytest
        run: pytest -q
      - name: Retrieval eval (dev)
        # evaluate.py เขียนตารางผลลง $GITHUB_STEP_SUMMARY เอง
        run: python -m rag.evaluate --split dev --method tfidf -k 4 --min-hit 0.9
      - name: pytest (W4 targets)
        run: pytest -q -m w4
      - name: Retrieval eval hybrid (dev)
        run: python -m rag.evaluate --split dev --method hybrid -k 4 --min-hit 0.9
